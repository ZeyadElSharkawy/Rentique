<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Categories - Vibrant Design</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter (retained) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff; /* Lighter, more neutral background */
        }
        /* Custom styles for enhanced hover effects and card appearance */
        .category-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* Smoother transition */
            border: 1px solid transparent; /* Start with transparent border */
            position: relative; /* For potential future absolute positioning of elements */
            overflow: hidden; /* Ensures content stays within rounded corners */
            /* Default for extra small screens (below sm): 2 columns */
            width: calc(50% - 1.5rem); /* 2 columns, accounting for gap-6 (1.5rem) */
            flex-shrink: 0; /* Prevent cards from shrinking below their content size */
        }

        /* For small screens (sm) and up: 3 columns */
        @media (min-width: 640px) { /* sm breakpoint and up */
            .category-card {
                /* Calculation: (100% - 2 * gap_size) / 3 = (100% - 2 * 2rem) / 3 = (100% - 4rem) / 3 */
                width: calc(33.333% - 1.333rem); /* 3 columns, accounting for gap-8 (2rem) */
            }
        }
        /* No need for md, lg, xl breakpoints as we want 3 columns consistently from sm up */

        .category-card:hover {
            transform: translateY(-8px); /* More pronounced lift */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); /* Deeper, softer shadow */
            border-color: rgba(255, 255, 255, 0.3); /* Subtle white border on hover */
        }
        /* Ensure text is white for better contrast on colored backgrounds */
        .category-card h3 {
            color: white;
            z-index: 10; /* Ensure text is above any background effects */
        }
        /* Styling for the PNG image icons */
        .category-card img {
            width: 80px; /* Adjusted width to 80px */
            height: 80px; /* Adjusted height to 80px */
            margin-bottom: 1rem; /* Equivalent to mb-4 in Tailwind */
            object-fit: contain; /* Ensures the image fits without cropping */
            /* Removed liquid glass effect properties */
            transition: all 0.3s ease-in-out; /* Keep transition for general smoothness */
        }
        .category-card:hover img {
            transform: scale(1.05); /* Keep slight scale on hover for a dynamic feel */
            /* Removed specific box-shadow for hover */
        }


        /* Specific gradient for each card for the background */
        .card-gradient-1 { background: linear-gradient(135deg, #A78BFA, #6366F1); } /* purple-400 to indigo-500 - Drama */
        .card-gradient-2 { background: linear-gradient(135deg, #22C55E, #14B8A6); } /* green-400 to teal-500 - Sports */
        .card-gradient-3 { background: linear-gradient(135deg, #FACC15, #F97316); } /* yellow-400 to orange-500 - Cultural */
        .card-gradient-4 { background: linear-gradient(135deg, #EF4444, #EC4899); } /* red-400 to pink-500 - Egyptian */
        .card-gradient-5 { background: linear-gradient(135deg, #3B82F6, #06B6D4); } /* blue-400 to cyan-500 - Cocktail */
        .card-gradient-6 { background: linear-gradient(135deg, #A855F7, #D946EF); } /* purple-500 to fuchsia-600 - Accessories */

    </style>
</head>

        <!-- Section Title -->

            <!-- Category Card 1: Drama Costumes -->
            <a href="https://edu-rentique.odoo.com/shop/category/drama-costumes-1" target="_top" class="category-card rounded-2xl shadow-lg flex flex-col items-center justify-center p-6 text-center card-gradient-1">
                <img src="icons8-curtains-100.png" alt="Drama Costumes Icon" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=🎭';">

                <img src="icons8-dancing-100.png" alt="Dancing Shows" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=�';">
                <h3 class="text-xl font-semibold">Dancing Shows</h3>
