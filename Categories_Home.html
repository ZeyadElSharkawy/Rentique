<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Categories - Vibrant Design</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter (retained) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff; /* Lighter, more neutral background */
        }
        /* Custom styles for enhanced hover effects and card appearance */
        .category-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* Smoother transition */
            border: 1px solid transparent; /* Start with transparent border */
            position: relative; /* For potential future absolute positioning of elements */
            overflow: hidden; /* Ensures content stays within rounded corners */

            /* Flex sizing for responsive columns:
               - default (extra-small / narrow): 2 columns (50%)
               - sm and up: 3 columns (33.333%)
               - very small screens: 1 column (100%) via media query below
            */
            flex: 0 0 calc(50% - 1.5rem);
            max-width: calc(50% - 1.5rem);
            box-sizing: border-box;
        }

        /* For small screens (sm) and up: 3 columns */
        @media (min-width: 640px) { /* sm breakpoint and up */
            .category-card {
                /* Calculation: (100% - 2 * gap_size) / 3 */
                flex: 0 0 calc(33.333% - 1.333rem);
                max-width: calc(33.333% - 1.333rem);
            }
        }

        /* Very small screens (phones) — single column for readability */
        @media (max-width: 420px) {
            .category-card {
                flex: 0 0 100%;
                max-width: 100%;
                width: 100%;
            }
            .category-card {
                padding: 1rem; /* Slightly smaller padding on very small screens */
            }
            .category-card img {
                width: 64px;
                height: 64px;
            }
            .category-card h3 {
                font-size: 1rem;
            }
        }

        .category-card:hover {
            transform: translateY(-8px); /* More pronounced lift */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); /* Deeper, softer shadow */
            border-color: rgba(255, 255, 255, 0.3); /* Subtle white border on hover */
        }
        /* Ensure text is white for better contrast on colored backgrounds */
        .category-card h3 {
            color: white;
            z-index: 10; /* Ensure text is above any background effects */
        }
        /* Styling for the PNG image icons */
        .category-card img {
            width: 80px; /* Adjusted width to 80px */
            height: 80px; /* Adjusted height to 80px */
            margin-bottom: 1rem; /* Equivalent to mb-4 in Tailwind */
            object-fit: contain; /* Ensures the image fits without cropping */
            transition: all 0.3s ease-in-out; /* Keep transition for general smoothness */
        }
        .category-card:hover img {
            transform: scale(1.05); /* Keep slight scale on hover for a dynamic feel */
        }

        /* Specific gradient for each card for the background */
        .card-gradient-1 { background: linear-gradient(135deg, #A78BFA, #6366F1); } /* purple-400 to indigo-500 - Drama */
        .card-gradient-2 { background: linear-gradient(135deg, #22C55E, #14B8A6); } /* green-400 to teal-500 - Sports */
        .card-gradient-3 { background: linear-gradient(135deg, #FACC15, #F97316); } /* yellow-400 to orange-500 - Cultural */
        .card-gradient-4 { background: linear-gradient(135deg, #EF4444, #EC4899); } /* red-400 to pink-500 - Egyptian */
        .card-gradient-5 { background: linear-gradient(135deg, #3B82F6, #06B6D4); } /* blue-400 to cyan-500 - Cocktail */
        .card-gradient-6 { background: linear-gradient(135deg, #A855F7, #D946EF); } /* purple-500 to fuchsia-600 - Accessories */

        /* Make anchors fully clickable blocks and preserve accessible focus */
        .category-card {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .category-card:focus {
            outline: 3px solid rgba(255,255,255,0.18);
            outline-offset: 4px;
        }

    </style>
</head>
<body class="p-4 sm:p-6 md:p-8 lg:p-10">

    <section class="max-w-7xl mx-auto py-12">
        <!-- Section Title -->

        <!-- Categories Flex Container -->
        <div class="flex flex-wrap justify-center gap-6 sm:gap-8">

            <!-- Category Card 1: Drama Costumes -->
            <a href="https://edu-rentique.odoo.com/shop/category/drama-costumes-1" target="_top" aria-label="Drama Costumes" class="category-card card-gradient-1 rounded-2xl shadow-lg flex flex-col items-center justify-center p-6 text-center">
                <img src="icons8-curtains-100.png" alt="Drama Costumes Icon" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%8E%AD';">

                <img src="icons8-dancing-100.png" alt="Dancing & Shows" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%92%83';">

            <!-- Category Card 3: Cultural Wear -->

                <img src="icons8-sombrero-100.png" alt="Cultural Wear Icon" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%91%98';">

                <img src="icons8-pyramids-100.png" alt="Egyptian Wear Icon" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%91%91';">

            <!-- Category Card 6: Accessories -->
            <a href="https://edu-rentique.odoo.com/shop/category/accessories-6" target="_top" aria-label="Accessories" class="category-card card-gradient-6 rounded-2xl shadow-lg flex flex-col items-center justify-center p-6 text-center">
                <img src="icons8-shopping-bag-100.png" alt="Accessories Icon" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%E2%8C%9A';">
                <h3 class="text-xl font-semibold">Accessories</h3>
            </a>

        </div>
    </section>

</body>
</html>
