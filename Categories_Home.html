<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Categories - Vibrant Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }

        .category-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            
            /* FIXED HEIGHT FIX: Ensure cards have a consistent minimum vertical presence */
            min-height: 200px; 
            flex: 0 0 calc(50% - 1rem); /* 2 columns on mobile by default */
            max-width: calc(50% - 1rem);
        }

        /* Tablet and Desktop: 3 columns */
        @media (min-width: 768px) { 
            .category-card {
                flex: 0 0 calc(33.333% - 1.5rem);
                max-width: calc(33.333% - 1.5rem);
                min-height: 240px;
            }
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .category-card {
                /* For very small screens, 1 column often looks better than 2 squashed ones */
                flex: 0 0 100%;
                max-width: 100%;
                min-height: 180px; 
                padding: 1.5rem;
            }
            .category-card img {
                width: 70px;
                height: 70px;
            }
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .category-card h3 {
            color: white;
            z-index: 10;
            margin-top: 0.5rem;
        }

        .category-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            object-fit: contain;
            transition: all 0.3s ease-in-out;
        }

        .category-card:hover img {
            transform: scale(1.1);
        }

        /* Gradients */
        .card-gradient-1 { background: linear-gradient(135deg, #A78BFA, #6366F1); }
        .card-gradient-2 { background: linear-gradient(135deg, #22C55E, #14B8A6); }
        .card-gradient-3 { background: linear-gradient(135deg, #FACC15, #F97316); }
        .card-gradient-4 { background: linear-gradient(135deg, #EF4444, #EC4899); }
        .card-gradient-5 { background: linear-gradient(135deg, #3B82F6, #06B6D4); }
        .card-gradient-6 { background: linear-gradient(135deg, #A855F7, #D946EF); }

        .category-card:focus {
            outline: 3px solid rgba(255,255,255,0.18);
            outline-offset: 4px;
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <section class="max-w-7xl mx-auto py-8">
        <div class="flex flex-wrap justify-center gap-4 md:gap-8">

            <a href="https://edu-rentique.odoo.com/shop/category/drama-costumes-1" target="_top" class="category-card card-gradient-1 rounded-2xl shadow-lg p-6">
                <img src="icons8-curtains-100.png" alt="Drama Costumes" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%8E%AD';">
                <h3 class="text-xl font-semibold">Drama Costumes</h3>
            </a>

            <a href="https://edu-rentique.odoo.com/shop/category/dancing-shows-4" target="_top" class="category-card card-gradient-2 rounded-2xl shadow-lg p-6">
                <img src="icons8-dancing-100.png" alt="Dancing & Shows" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%92%83';">
                <h3 class="text-xl font-semibold">Dancing & Shows</h3>
            </a>

            <a href="https://edu-rentique.odoo.com/shop/category/culture-wear-2" target="_top" class="category-card card-gradient-3 rounded-2xl shadow-lg p-6">
                <img src="icons8-sombrero-100.png" alt="Cultural Wear" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%91%98';">
                <h3 class="text-xl font-semibold">Cultural Wear</h3>
            </a>

            <a href="https://edu-rentique.odoo.com/shop/category/egyptian-wear-5" target="_top" class="category-card card-gradient-4 rounded-2xl shadow-lg p-6">
                <img src="icons8-pyramids-100.png" alt="Egyptian Wear" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%91%91';">
                <h3 class="text-xl font-semibold">Egyptian Wear</h3>
            </a>

            <a href="https://edu-rentique.odoo.com/shop/category/classic-elegant-3" target="_top" class="category-card card-gradient-5 rounded-2xl shadow-lg p-6">
                <img src="icons8-tailors-dummy-48.png" alt="Classic & Elegant" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%F0%9F%91%97';">
                <h3 class="text-xl font-semibold">Classic & Elegant</h3>
            </a>

            <a href="https://edu-rentique.odoo.com/shop/category/accessories-6" target="_top" class="category-card card-gradient-6 rounded-2xl shadow-lg p-6">
                <img src="icons8-shopping-bag-100.png" alt="Accessories" onerror="this.src='https://placehold.co/100x100/FFFFFF/000000?text=%E2%8C%9A';">
                <h3 class="text-xl font-semibold">Accessories</h3>
            </a>

        </div>
    </section>

</body>
</html>
