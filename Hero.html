<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rentique - Premium Rentals for Every Occasion</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      /* Ensure these are truly transparent */
      background-color: transparent !important;
      background-image: none !important; /* Explicitly remove any default background image */
    }

    h1, h2, h3, .font-poppins {
      font-family: 'Poppins', sans-serif;
    }

    .dynamic-text {
      display: inline-block;
      min-width: 250px;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }
    
    /* Hero background image */
    .hero-section {
      background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1531259683007-016a7b628fc3?ixlib=rb-4.0.3&auto=format&fit=crop&w=2067&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    
    /* Main photo styling */
    .main-photo-container {
      display: flex;
      justify-content: center;
      margin-top: 2rem;
    }
    
    .main-photo {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      object-fit: cover;
    }
    
    /* Mobile-specific adjustments */
    @media (max-width: 768px) {
      .hero-section {
        text-align: center;
        padding-top: 6rem;
        padding-bottom: 3rem;
        min-height: auto;
      }
      
      .main-photo-container {
        margin-top: 3rem;
        margin-bottom: 2rem;
      }
      
      .main-photo {
        max-width: 320px;
        margin: 0 auto;
      }
      
      .mobile-stack {
        flex-direction: column;
        gap: 1rem;
      }
      
      .mobile-stack a {
        width: 100%;
        max-width: 280px;
        margin: 0 auto;
      }
    }
    
    @media (max-width: 640px) {
      .main-photo {
        max-width: 280px;
      }
    }
  </style>
</head>

<body class="text-gray-800 bg-transparent">

  <main>
    <section class="hero-section">
      <div class="container mx-auto px-4 sm:px-6">
        <div class="flex flex-col lg:flex-row items-center justify-between">
          <!-- Text Content -->
          <div class="lg:w-1/2 w-full text-center lg:text-left mb-10 lg:mb-0">
            <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold mb-4 lg:mb-6 leading-tight">
              Bring Their Stories to Life: <br class="hidden sm:block" />
              Unforgettable Costumes for <br class="hidden sm:block" />
              <span id="dynamic-event-type" class="dynamic-text text-[#FFD700]">SCHOOL EVENTS</span>
            </h1>
            <p class="text-base sm:text-lg md:text-xl text-gray-200 mb-6 lg:mb-8 max-w-3xl mx-auto lg:mx-0">
              Rentique provides schools with high-quality, themed costumes for annual shows, plays, and special events. Easy, affordable, and memorable.
            </p>
            <div class="flex flex-col sm:flex-row justify-center lg:justify-start items-center space-y-4 sm:space-y-0 sm:space-x-4 mobile-stack">
              <a href="https://edu-rentique.odoo.com/shop" target="_top" class="flex items-center justify-center bg-[#1A2F6B] text-white px-6 py-3 rounded-full hover:bg-[#6B92F2] transition-transform duration-300 transform hover:scale-105 shadow-lg text-base sm:text-lg font-semibold w-full sm:w-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 7M7 13l-2 9m12-9l2 9m-6-9v9" />
                </svg>
                Shop Costumes
              </a>
              <a href="https://wa.me/message/DR4FLUBQJL3ZC1" target="_top" class="flex items-center justify-center bg-green-600 text-white px-6 py-3 rounded-full hover:bg-green-500 transition-transform duration-300 transform hover:scale-105 shadow-lg text-base sm:text-lg font-medium w-full sm:w-auto">
                Contact Us
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2 text-white" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M16.7 13.1c-.2-.1-1.2-.6-1.3-.7s-.3-.1-.5.1-.6.7-.7.8-.3.1-.5 0a6.5 6.5 0 0 1-2-1.2 7.2 7.2 0 0 1-1.4-1.8c-.1-.3 0-.5.1-.6l.3-.3c.1-.1.2-.3.2-.4s0-.3 0-.4c0-.1-.5-1.2-.7-1.6s-.4-.4-.6-.4h-.5c-.1 0-.4 0-.6.3s-.8.8-.8 2 .8 2.4 1 2.6c.1.1 1.5 2.3 3.7 3.2 2.2.9 2.2.6 2.6.5.4-.1 1.2-.5 1.3-1s.1-.9 0-1c0-.1-.2-.1-.4-.2z"/>
                  <path fill-rule="evenodd" d="M12 2a10 10 0 0 0-8.5 15.1L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 2a8 8 0 0 1 7 11.9l.3.6-3.2.9-.4-.2a7.9 7.9 0 0 1-10.6-6.3A8 8 0 0 1 12 4z" clip-rule="evenodd"/>
                </svg>
              </a>
            </div>
          </div>
          
          <!-- Main Photo -->
          <div class="lg:w-1/2 w-full main-photo-container">
            <img 
              src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80" 
              alt="Children in school costumes performing on stage" 
              class="main-photo"
            />
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const dynamicTextElement = document.getElementById('dynamic-event-type');
      const eventTypes = ["ANNUAL SHOWS", "SCHOOL DRAMA", "CULTURAL EVENTS", "GRADUATION CEREMONY"];
      let currentEventTypeIndex = 0;

      function updateDynamicText() {
        dynamicTextElement.style.opacity = '0';
        setTimeout(() => {
          currentEventTypeIndex = (currentEventTypeIndex + 1) % eventTypes.length;
          dynamicTextElement.textContent = eventTypes[currentEventTypeIndex];
          void dynamicTextElement.offsetWidth;
          dynamicTextElement.style.opacity = '1';
        }, 500);
      }

      setInterval(updateDynamicText, 3000);
    });
  </script>
</body>
</html>
