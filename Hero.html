<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rentique - Premium Rentals for Every Occasion</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      /* Ensure these are truly transparent */
      background-color: transparent !important;
      background-image: none !important; /* Explicitly remove any default background image */
    }

    h1, h2, h3, .font-poppins {
      font-family: 'Poppins', sans-serif;
    }

    .dynamic-text {
      display: inline-block;
      /* allow the text block to shrink on small screens to prevent overflow */
      min-width: 0;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
      white-space: nowrap;
    }
  </style>
</head>

<body class="text-gray-800 bg-transparent">

  <main>
    <!-- Reduced vertical padding on small screens, larger on md+ -->
    <section class="text-white py-16 md:py-32 flex items-center justify-center bg-transparent">
      <div class="container mx-auto px-4 sm:px-6 text-center">
        <h1 class="text-3xl sm:text-4xl md:text-6xl font-bold mb-4 leading-snug md:leading-tight">
          Bring Their Stories to Life: <br class="hidden sm:block" />
          Unforgettable Costumes for <br />
          <span id="dynamic-event-type" class="dynamic-text text-[#FFD700] font-poppins" aria-live="polite">SCHOOL EVENTS</span>
        </h1>
        <p class="text-base sm:text-lg md:text-xl text-gray-200 mb-8 max-w-3xl mx-auto">
          Rentique provides schools with high-quality, themed costumes for annual shows, plays, and special events. Easy, affordable, and memorable.
        </p>

        <!-- On small screens buttons stack (flex-col) and become full width; on sm+ they are inline (flex-row) -->
        <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
          <a href="https://edu-rentique.odoo.com/shop" target="_blank" rel="noopener noreferrer"
             class="flex items-center justify-center bg-[#1A2F6B] text-white px-6 py-3 rounded-full hover:bg-[#6B92F2] transition-transform duration-300 w-full sm:w-auto">
            <!-- Shopping cart icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 7M7 13l-2 9m12-9l2 9m-6-9v9" />
            </svg>
            <span class="font-medium">Shop</span>
          </a>

          <a href="https://wa.me/message/DR4FLUBQJL3ZC1" target="_blank" rel="noopener noreferrer"
             class="flex items-center justify-center bg-green-600 text-white px-6 py-3 rounded-full hover:bg-green-500 transition-transform duration-300 w-full sm:w-auto">
            <span class="font-medium mr-2">Contact Us</span>
            <!-- Simple WhatsApp icon (filled) -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M16.7 13.1c-.2-.1-1.2-.6-1.3-.7s-.3-.1-.5.1-.6.7-.7.8-.3.1-.5 0a6.5 6.5 0 0 1-2-1.2 7.2 7.2 0 0 1-1.4-1.8c-.1-.3 0-.5.1-.6l.3-.3c.1-.1.2-.3.2-.4s0-.3 0-.4c0-.1-.5-1.2-.7-1.6s-.4-.4-.5-.4h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 3s1.3 3.6 1.5 3.8 2.6 4 6.3 5.4c4 1.5 4.1 1 4.8.9.7-.1 2.4-1 2.7-2.4.3-1.3.3-2.4.2-2.6-.1-.2-1.2-.4-2.2-1.1z"/>
              <path d="M12 2a10 10 0 0 0-8.5 15.1L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 2a8 8 0 0 1 7 11.9l.3.6-3.2.9-.4-.2A7.9 7.9 0 0 1 8.7 8.1 8 8 0 0 1 12 4z" clip-rule="evenodd"/>
            </svg>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const dynamicTextElement = document.getElementById('dynamic-event-type');
      // include the currently shown text as the first element so the cycle starts consistently
      const eventTypes = ["SCHOOL EVENTS", "ANNUAL SHOWS", "SCHOOL DRAMA", "CULTURAL EVENTS", "GRADUATION CEREMONY"];
      let currentEventTypeIndex = 0;

      function updateDynamicText() {
        dynamicTextElement.style.opacity = '0';
        setTimeout(() => {
          currentEventTypeIndex = (currentEventTypeIndex + 1) % eventTypes.length;
          dynamicTextElement.textContent = eventTypes[currentEventTypeIndex];
          // force reflow for transition restart
          void dynamicTextElement.offsetWidth;
          dynamicTextElement.style.opacity = '1';
        }, 500);
      }

      // only start the interval if element exists
      if (dynamicTextElement) {
        setInterval(updateDynamicText, 3000);
      }
    });
  </script>
</body>
</html>
